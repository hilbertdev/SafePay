<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafePay — Submit a transaction</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #5c6778;
      --line: #d5dbe3;
      --paper: #f4f6f8;
      --card: #ffffff;
      --accent: #0f6e56;
      --accent-ink: #ffffff;
      --danger: #9b2c2c;
      --ok: #0f6e56;
      --high-bg: #fde8e8;
      --high-ink: #9b2c2c;
      --low-bg: #e6f4ef;
      --low-ink: #0f6e56;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    main {
      width: min(56rem, calc(100% - 2rem));
      margin: 2.5rem auto 3rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.5;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    form, .result, .history {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem 1rem;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    label.wide { grid-column: 1 / -1; }

    input {
      font: inherit;
      font-weight: 400;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    input:focus {
      outline: 2px solid #b7ddd2;
      border-color: var(--accent);
    }

    button {
      margin-top: 1.1rem;
      font: inherit;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .result {
      margin-top: 1rem;
    }

    .result h2,
    .history h2 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
    }

    .result.ok h2 { color: var(--ok); }
    .result.error h2 { color: var(--danger); }

    .history {
      margin-top: 1.5rem;
    }

    .history-meta {
      margin: 0 0 0.85rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th, td {
      text-align: left;
      padding: 0.55rem 0.65rem;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      font-weight: 600;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .risk {
      display: inline-block;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.45rem;
      border-radius: 999px;
    }

    .risk.high {
      background: var(--high-bg);
      color: var(--high-ink);
    }

    .risk.low {
      background: var(--low-bg);
      color: var(--low-ink);
    }

    .empty, .history-error {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .history-error {
      color: var(--danger);
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    @media (max-width: 36rem) {
      .fields { grid-template-columns: 1fr; }
      label.wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>SafePay</h1>
    <p class="lede">Submit one payment. The form posts JSON to <code>POST /transactions</code> and shows the response. The history below lists every stored transaction with its risk assessment.</p>

    <form id="transaction-form">
      <div class="fields">
        <label>
          Transaction ID
          <input name="transactionId" required value="TX001" autocomplete="off">
        </label>
        <label>
          Customer ID
          <input name="customerId" required value="C101" autocomplete="off">
        </label>
        <label>
          Amount
          <input name="amount" type="number" required step="0.01" value="250.00">
        </label>
        <label>
          Currency
          <input name="currency" required value="ZAR" maxlength="3" autocomplete="off">
        </label>
        <label class="wide">
          Location
          <input name="location" required value="Cape Town" autocomplete="off">
        </label>
        <label class="wide">
          Timestamp
          <input name="timestamp" type="datetime-local" required step="1" value="2026-10-13T09:00:00">
        </label>
      </div>
      <button type="submit">Submit transaction</button>
    </form>

    <section id="result" class="result" hidden>
      <h2 id="result-title"></h2>
      <pre id="result-body"></pre>
    </section>

    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">Risk assessment history</h2>
      <p id="history-meta" class="history-meta">Loading…</p>
      <div id="history-content"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("transaction-form");
    const result = document.getElementById("result");
    const resultTitle = document.getElementById("result-title");
    const resultBody = document.getElementById("result-body");
    const button = form.querySelector("button");
    const historyMeta = document.getElementById("history-meta");
    const historyContent = document.getElementById("history-content");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function formatAmount(amount, currency) {
      return escapeHtml(amount) + " " + escapeHtml(currency);
    }

    function riskBadge(risk) {
      const level = String(risk || "").toUpperCase();
      const cls = level === "HIGH" ? "high" : "low";
      return '<span class="risk ' + cls + '">' + escapeHtml(level || "—") + "</span>";
    }

    function renderHistory(items) {
      if (!items.length) {
        historyMeta.textContent = "No transactions stored yet.";
        historyContent.innerHTML = '<p class="empty">Submit a transaction or import CSV data to build the history.</p>';
        return;
      }

      historyMeta.textContent = items.length + " transaction" + (items.length === 1 ? "" : "s") + " assessed.";

      const rows = items.map((item) => {
        const tx = item.transaction || {};
        return "<tr>"
          + "<td>" + escapeHtml(tx.transactionId || "") + "</td>"
          + "<td>" + escapeHtml(tx.customerId || "") + "</td>"
          + "<td>" + formatAmount(tx.amount ?? "", tx.currency || "") + "</td>"
          + "<td>" + escapeHtml(tx.location || "") + "</td>"
          + "<td>" + escapeHtml(tx.timestamp || "") + "</td>"
          + "<td>" + riskBadge(item.risk) + "</td>"
          + "</tr>";
      }).join("");

      historyContent.innerHTML =
        '<div class="table-wrap"><table>'
        + "<thead><tr>"
        + "<th>ID</th><th>Customer</th><th>Amount</th><th>Location</th><th>Timestamp</th><th>Risk</th>"
        + "</tr></thead>"
        + "<tbody>" + rows + "</tbody>"
        + "</table></div>";
    }

    async function loadHistory() {
      historyMeta.textContent = "Loading…";
      try {
        const response = await fetch("/transactions");
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const items = await response.json();
        renderHistory(Array.isArray(items) ? items : []);
      } catch (error) {
        historyMeta.textContent = "";
        historyContent.innerHTML =
          '<p class="history-error">Could not load history: ' + escapeHtml(error.message) + "</p>";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const payload = {
        transactionId: data.get("transactionId").trim(),
        customerId: data.get("customerId").trim(),
        amount: Number(data.get("amount")),
        currency: data.get("currency").trim(),
        location: data.get("location").trim(),
        timestamp: data.get("timestamp")
      };

      button.disabled = true;
      result.hidden = true;

      try {
        const response = await fetch("/transactions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const text = await response.text();
        let shown = text;
        try {
          shown = JSON.stringify(JSON.parse(text), null, 2);
        } catch (ignored) {
          shown = text || response.statusText;
        }
        result.hidden = false;
        result.className = response.ok ? "result ok" : "result error";
        resultTitle.textContent = response.ok
          ? "Accepted"
          : "Rejected (" + response.status + ")";
        resultBody.textContent = shown;
        if (response.ok) {
          await loadHistory();
        }
      } catch (error) {
        result.hidden = false;
        result.className = "result error";
        resultTitle.textContent = "Could not reach the server";
        resultBody.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    loadHistory();
  </script>
</body>
</html>
