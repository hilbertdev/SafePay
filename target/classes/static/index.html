<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafePay — Submit a transaction</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #5c6778;
      --line: #d5dbe3;
      --paper: #f4f6f8;
      --card: #ffffff;
      --accent: #0f6e56;
      --accent-ink: #ffffff;
      --danger: #9b2c2c;
      --ok: #0f6e56;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    main {
      width: min(40rem, calc(100% - 2rem));
      margin: 2.5rem auto 3rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.5;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    form, .result {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem 1rem;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    label.wide { grid-column: 1 / -1; }

    input {
      font: inherit;
      font-weight: 400;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    input:focus {
      outline: 2px solid #b7ddd2;
      border-color: var(--accent);
    }

    button {
      margin-top: 1.1rem;
      font: inherit;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .result {
      margin-top: 1rem;
    }

    .result h2 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
    }

    .result.ok h2 { color: var(--ok); }
    .result.error h2 { color: var(--danger); }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    @media (max-width: 36rem) {
      .fields { grid-template-columns: 1fr; }
      label.wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>SafePay</h1>
    <p class="lede">Submit one payment. The form posts JSON to <code>POST /transactions</code> and shows the response.</p>

    <form id="transaction-form">
      <div class="fields">
        <label>
          Transaction ID
          <input name="transactionId" required value="TX001" autocomplete="off">
        </label>
        <label>
          Customer ID
          <input name="customerId" required value="C101" autocomplete="off">
        </label>
        <label>
          Amount
          <input name="amount" type="number" required step="0.01" value="250.00">
        </label>
        <label>
          Currency
          <input name="currency" required value="ZAR" maxlength="3" autocomplete="off">
        </label>
        <label class="wide">
          Location
          <input name="location" required value="Cape Town" autocomplete="off">
        </label>
        <label class="wide">
          Timestamp
          <input name="timestamp" type="datetime-local" required step="1" value="2026-10-13T09:00:00">
        </label>
      </div>
      <button type="submit">Submit transaction</button>
    </form>

    <section id="result" class="result" hidden>
      <h2 id="result-title"></h2>
      <pre id="result-body"></pre>
    </section>
  </main>

  <script>
    const form = document.getElementById("transaction-form");
    const result = document.getElementById("result");
    const resultTitle = document.getElementById("result-title");
    const resultBody = document.getElementById("result-body");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const payload = {
        transactionId: data.get("transactionId").trim(),
        customerId: data.get("customerId").trim(),
        amount: Number(data.get("amount")),
        currency: data.get("currency").trim(),
        location: data.get("location").trim(),
        timestamp: data.get("timestamp")
      };

      button.disabled = true;
      result.hidden = true;

      try {
        const response = await fetch("/transactions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const text = await response.text();
        let shown = text;
        try {
          shown = JSON.stringify(JSON.parse(text), null, 2);
        } catch (ignored) {
          shown = text || response.statusText;
        }
        result.hidden = false;
        result.className = response.ok ? "result ok" : "result error";
        resultTitle.textContent = response.ok
          ? "Accepted"
          : "Rejected (" + response.status + ")";
        resultBody.textContent = shown;
      } catch (error) {
        result.hidden = false;
        result.className = "result error";
        resultTitle.textContent = "Could not reach the server";
        resultBody.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
